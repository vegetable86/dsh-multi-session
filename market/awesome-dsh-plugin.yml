url: https://github.com/vegetable86/dsh-multi-session
name: vegetable86/dsh-multi-session
category: ui
description:
  en: 'Splits the main panel into any number of session panes, each rendering a full native conversation (transcript and composer) bound to a session; panes can be added, maximized and closed, new sessions can be created inside a pane, and the layout persists across restarts.'
  zh: '把主面板切成任意数量的会话格子，每格都是完整的原生对话（消息流与输入框）；格子可增删、最大化、在格内直接新建会话，布局与会话绑定在重启后恢复。'
