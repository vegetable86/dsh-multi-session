  en: 'Tiling multi-session workspace for the DSH web UI: 1-4 panes whose splitters resize neighbouring tiles together, browser-style tabs that keep several tiling boards, drag-to-swap sessions, per-pane session pickers, and a workspace chooser when creating a session inside a pane.'
